<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI全自动成片工具｜带完整日志</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/element-plus"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .step-finish{background:#52c41a;width:16px;height:16px;border-radius:50%}
    .step-running{background:#faad14;width:16px;height:16px;border-radius:50%}
    .step-wait{background:#999;width:16px;height:16px;border-radius:50%}
    .step-item{display:flex;align-items:center;gap:12px;margin:10px 0}
    .log-box{background:#1e1e1e;color:#dcdcdc;padding:15px;border-radius:6px;height:480px;overflow-y:auto;white-space:pre-wrap;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
<div id="app" class="app-wrap">
  <div class="left-bar">
    <button class="new-task-btn" @click="showInput = true">+ 新建生成任务</button>
    <div class="task-list">
      <div v-for="item in taskList" :key="item.id" class="task-item" :class="{active:curTaskId===item.id}" @click="switchTask(item)">
        {{item.name}}
        <div style="font-size:12px;color:#999">{{item.status}}</div>
      </div>
    </div>
  </div>

  <div class="mid-panel" v-if="curTask">
    <div class="task-info">
      <h3>{{curTask.name}}</h3>
      <div>状态：{{curTask.status}}</div>
      <div style="margin:6px 0">
        <el-button type="primary" @click="getVideoInfo">刷新</el-button>
        <el-button type="info" @click="openLog">查看完整日志</el-button>
      </div>
    </div>

    <div class="step-list">
      <div v-for="(s,i) in stepList" :key="i" class="step-item">
        <div :class="curTask.step > i ? 'step-finish' : curTask.step == i ? 'step-running' : 'step-wait'"></div>
        <div>
          <div>{{s.name}}</div>
          <div style="font-size:12px;color:#999">{{s.desc}}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="right-panel" v-if="curTask">
    <el-tabs v-model="activeTab">
      <el-tab-pane label="文案" name="text">
        <div class="content-box">{{taskContent}}</div>
      </el-tab-pane>
      <el-tab-pane label="图片" name="image">
        <div class="content-box img-grid">
          <div class="img-item" v-for="img in imgList"><img :src="img" alt=""></div>
        </div>
      </el-tab-pane>
      <el-tab-pane label="日志" name="log">
        <div class="log-box">{{curTask.logList ? curTask.logList.join('\n') : '暂无日志'}}</div>
      </el-tab-pane>
    </el-tabs>
  </div>

  <el-dialog v-model="showInput" title="导入文案" width="550px">
    <el-button @click="selectFile">导入 TXT</el-button>
    <input ref="fileRef" type="file" accept=".txt" hidden @change="readFile">
    <el-input type="textarea" v-model="inputText" rows="10"></el-input>
    <template #footer>
      <el-button @click="createTask">开始生成</el-button>
    </template>
  </el-dialog>

  <el-dialog v-model="logShow" title="完整运行日志" width="750px">
    <div class="log-box">{{logText}}</div>
  </el-dialog>
</div>

<script>
const { createApp, onMounted } = Vue
createApp({
  setup() {
    const taskList = Vue.ref([{ id: "t0", name: "演示任务", status: "就绪", step: -1, logList: [] }])
    const curTaskId = Vue.ref("t0")
    const curTask = Vue.computed(() => taskList.value.find(i => i.id === curTaskId.value) || {})
    const activeTab = Vue.ref("log")
    const taskContent = Vue.ref("")
    const imgList = Vue.ref([])
    const showInput = Vue.ref(false)
    const inputText = Vue.ref("")
    const fileRef = Vue.ref(null)
    const logShow = Vue.ref(false)
    const logText = Vue.ref("")

    const stepList = [
      { name: "1. 文案预审清洗", desc: "AI 优化文案" },
      { name: "2. 纪录片口播改写", desc: "生成旁白" },
      { name: "3. 智能拆分影视分镜", desc: "JSON 输出" },
      { name: "4. 生成绘图关键词", desc: "万相提示词" },
      { name: "5. 通义万相批量配图", desc: "生成图片" },
      { name: "6. 火山引擎真人配音", desc: "生成音频" },
      { name: "7. 视频合成+BGM", desc: "输出 MP4" }
    ]

    const selectFile = () => fileRef.value?.click()
    const readFile = (e) => {
      const f = e.target.files[0]
      const reader = new FileReader()
      reader.onload = ev => inputText.value = ev.target.result
      reader.readAsText(f)
    }

    const createTask = async () => {
      if (!inputText.value) return alert("请输入文案")
      const res = await fetch("/api/task", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: inputText.value, taskName: "新任务" })
      })
      const d = await res.json()
      taskList.value.push({ id: d.taskId, name: "新任务", status: "开始执行", step: 0, logList: [] })
      curTaskId.value = d.taskId
      showInput.value = false
    }

    const switchTask = (item) => {
      curTaskId.value = item.id
      getVideoInfo()
    }

    const getVideoInfo = async () => {
      const res = await fetch(`/api/task?id=${curTaskId.value}`)
      const d = await res.json()
      taskContent.value = d.script || d.content
      imgList.value = d.imgs || []
      const t = taskList.value.find(x => x.id === curTaskId.value)
      if (t) {
        t.step = d.step
        t.status = d.status
        t.logList = d.logList || []
        t.shotNum = d.shotNum
      }
    }

    const openLog = () => {
      logText.value = (curTask.value.logList || []).join('\n')
      logShow.value = true
    }

    onMounted(() => {
      setInterval(() => {
        if (curTaskId.value) getVideoInfo()
      }, 2500)
    })

    return {
      taskList, curTaskId, curTask, activeTab, taskContent, imgList,
      stepList, showInput, inputText, fileRef, selectFile, readFile,
      createTask, switchTask, getVideoInfo, openLog, logShow, logText
    }
  }
}).use(ElementPlus).mount("#app")
</script>
</body>
</html>
