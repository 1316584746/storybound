<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI全自动成片工具｜通义+万相+火山TTS+BGM</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <script src="https://unpkg.com/element-plus"></script>
  <link rel="stylesheet" href="./public/css/style.css">
  <style>
    .dl-btn{background:#27AE60;padding:8px 16px;border:none;border-radius:5px;color:#fff;margin-top:10px;cursor:pointer}
    .cfg-row{margin:8px 0;font-size:13px;color:#ccc}
  </style>
</head>
<body>
<div id="app" class="app-wrap">
  <!--左栏任务列表-->
  <div class="left-bar">
    <button class="new-task-btn" @click="openCreateTask">+ 新建生成任务</button>
    <div class="cfg-row">
      <el-checkbox v-model="openBGM">开启背景音乐</el-checkbox>
    </div>
    <div class="task-list">
      <div v-for="item in taskList" :key="item.id" class="task-item" :class="{active:curTaskId===item.id}" @click="switchTask(item)">
        {{item.name}}
        <div style="font-size:12px;color:#999">{{item.status}}</div>
      </div>
    </div>
  </div>
  <!--中栏7步进度-->
  <div class="mid-panel" v-if="curTask">
    <div class="task-info">
      <h3>{{curTask.name}}</h3>
      <div>分镜总数：{{curTask.shotNum||0}}｜{{curTask.status}}</div>
      <button @click="getVideoInfo" style="margin-top:6px">刷新成片状态</button>
    </div>
    <div class="step-list">
      <div v-for="step in stepList" :key="step.name" class="step-item">
        <div class="step-icon" :class="step.tag"></div>
        <div>
          <div>{{step.name}}</div>
          <div style="font-size:12px;color:#999" v-if="step.desc">{{step.desc}}</div>
        </div>
      </div>
    </div>
  </div>
  <!--右栏预览：文案/分镜/成片-->
  <div class="right-panel" v-if="curTask">
    <el-tabs v-model="activeTab">
      <el-tab-pane label="文案预览" name="text">
        <div class="content-box">{{taskContent}}</div>
      </el-tab-pane>
      <el-tab-pane label="分镜画廊" name="image">
        <div class="content-box img-grid">
          <div class="img-item" v-for="img in imgList"><img :src="img" alt=""></div>
        </div>
      </el-tab-pane>
      <el-tab-pane label="成片视频" name="video">
        <div class="content-box">
          <div v-if="videoTip" style="color:#7ccd7c;margin-bottom:10px">{{videoTip}}</div>
          <div v-if="!videoTip">视频生成中，等待全部步骤跑完</div>
          <a v-if="videoTip&&videoTip.indexOf('完成')!=-1" href="#" @click="alert(videoTip)">
            <button class="dl-btn">查看本地MP4路径</button>
          </a>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>
</div>

<script>
const { createApp } = Vue
createApp({
  setup(){
    const taskList = Vue.ref([{id:"t0",name:"演示任务",status:"就绪",shotNum:0}])
    const curTaskId = Vue.ref("t0")
    const curTask = Vue.computed(()=>taskList.value.find(i=>i.id===curTaskId.value))
    const activeTab = Vue.ref("text")
    const taskContent = Vue.ref("")
    const imgList = Vue.ref([])
    const videoTip = Vue.ref("")
    const openBGM = Vue.ref(true)

    const stepList = Vue.ref([
      { name:"文案预审清洗", tag:"step-finish", desc:"通义千问优化原文" },
      { name:"纪录片口播改写", tag:"step-finish", desc:"生成15-20min旁白稿" },
      { name:"智能拆分影视分镜", tag:"step-finish", desc:"输出画面+台词+时长JSON" },
      { name:"生成AI绘图关键词", tag:"step-running", desc:"适配通义万相参数" },
      { name:"通义万相批量配图", tag:"step-wait", desc:"在线生成分镜画面" },
      { name:"火山引擎真人配音", tag:"step-wait", desc:"纪录片女声旁白" },
      { name:"FFmpeg合成+背景音乐", tag:"step-wait", desc:"自动混音输出MP4" }
    ])

    //新建任务
    const openCreateTask = ()=>{
      let raw = prompt("粘贴需要生成成片的完整文案：")
      if(!raw)return
      fetch("/api/task",{
        method:"POST",
        body:JSON.stringify({content:raw,taskName:"新生成任务"})
      }).then(res=>res.json()).then(d=>{
        taskList.value.push({id:d.taskId,name:"新生成任务",status:"排队中",shotNum:0})
      })
    }
    //切换任务
    const switchTask = (item)=>{
      curTaskId.value = item.id
      getVideoInfo()
    }
    //刷新任务详情
    const getVideoInfo = ()=>{
      fetch(`/api/task?id=${curTaskId.value}`).then(r=>r.json()).then(d=>{
        taskContent.value = d.script||d.content
        imgList.value = d.imgs||[]
        videoTip.value = d.downloadTip||""
      })
    }

    return {taskList,curTaskId,curTask,activeTab,taskContent,imgList,videoTip,stepList,openBGM,openCreateTask,switchTask,getVideoInfo}
  }
}).use(ElementPlus).mount("#app")
</script>
</body>
</html>
